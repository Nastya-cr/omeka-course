services:
  proxy:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${LIBRARY_PORT:-8080}:80"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [front]
    restart: unless-stopped
  omeka:
    image: omeka-course:local
    build: ./app
    depends_on:
      db:
        condition: service_healthy
    secrets: [omeka_db_password]
    volumes:
      - files:/var/www/html/files
    networks: [front, back]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1/admin"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 30s
    restart: unless-stopped
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: omeka
      MARIADB_USER: omeka
      MARIADB_PASSWORD_FILE: /run/secrets/omeka_db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/omeka_root_password
    secrets: [omeka_db_password, omeka_root_password]
    volumes:
      - database:/var/lib/mysql
    networks: [back]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  monitor:
    image: busybox:1.37
    entrypoint: ["/bin/sh", "/usr/local/bin/monitor.sh"]
    volumes:
      - ./scripts/monitor.sh:/usr/local/bin/monitor.sh:ro
    networks: [front]
    restart: unless-stopped
  backup:
    image: mariadb:11.4
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-loop.sh"]
    secrets: [omeka_db_password]
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ./scripts/backup-loop.sh:/usr/local/bin/backup-loop.sh:ro
      - files:/omeka-files:ro
      - backups:/backups
    networks: [back]
    restart: unless-stopped
networks:
  front:
  back:
    internal: true
volumes:
  database:
  files:
  backups:
secrets:
  omeka_db_password:
    file: ./.secrets/omeka_db_password
  omeka_root_password:
    file: ./.secrets/omeka_root_password
