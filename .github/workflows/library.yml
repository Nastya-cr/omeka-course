name: Omeka S CI and delivery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this version to the teaching cluster
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start test stand
        run: |
          sh scripts/init-secrets.sh
          docker compose up -d --build
          sh scripts/smoke.sh
      - name: Verify backup archive
        run: |
          docker compose exec -T backup sh /usr/local/bin/backup.sh
          docker compose exec -T backup sh -ec 'for b in /backups/*; do (cd "$b" && sha256sum -c SHA256SUMS && tar -tzf files.tar.gz >/dev/null); done'
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Remove test stand
        if: always()
        run: docker compose down -v
  publish:
    needs: smoke
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: ref
        name: Set image tag
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/omeka:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ref.outputs.image }}
  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: [self-hosted, linux, library-swarm]
    timeout-minutes: 12
    concurrency: library-swarm
    permissions:
      contents: read
      packages: read
    env:
      CONFIG_REV: ${{ github.sha }}
      OMEKA_IMAGE: ${{ needs.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy five services
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export DOCKER_CONFIG="$(mktemp -d "$RUNNER_TEMP/omeka-registry.XXXXXX")"
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker stack deploy --with-registry-auth --detach=false -c stack.yaml library
          docker stack services library
          sh scripts/smoke.sh
